<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a4d6d" />
  <title>BTC Marine Conservation Hub</title>
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="icon" href="app-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="app-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="styles.css?v=2" />
</head>
<body>
  <!-- ===== Password gate ===== -->
  <div id="gate" class="gate">
    <div class="gate-card">
      <img class="gate-logo" src="logo.png" alt="Black Turtle Conservation" />
      <h1>Marine Conservation Hub</h1>
      <p class="muted">Enter the team password to continue.</p>
      <form id="gate-form">
        <input id="gate-input" type="password" placeholder="Password" autocomplete="current-password" />
        <button type="submit" class="btn btn-primary">Enter</button>
        <div id="gate-error" class="gate-error hidden">Incorrect password</div>
      </form>
    </div>
  </div>

  <!-- ===== App ===== -->
  <div id="shell" class="shell hidden">
    <header class="topbar">
      <div class="topbar-row">
        <img class="brand-mark" src="logo.png" alt="Black Turtle Conservation"
             onerror="this.onerror=null;this.src='icon.svg'" />
        <div class="brand-text">
          <span class="brand-line-1">Marine Conservation Hub</span>
          <span class="brand-line-2">Black Turtle Conservation</span>
        </div>
        <div class="topbar-actions">
          <span id="net-dot" class="net-dot" title="Connection"></span>
          <button id="undo-btn" class="icon-btn" title="Undo last change">↶</button>
          <button id="theme-btn" class="icon-btn" title="Toggle light / dark">◐</button>
        </div>
      </div>
      <nav id="tabs" class="tabs">
        <button class="tab active" data-screen="dashboard">Dashboard</button>
        <button class="tab" data-screen="schedule">Schedule</button>
        <button class="tab" data-screen="students">Students</button>
        <button class="tab" data-screen="certs">Certifications</button>
        <button class="tab" data-screen="staff">Staff</button>
        <button class="tab" data-screen="catalogue">Catalogue</button>
        <button class="tab" data-screen="settings">Settings</button>
      </nav>
    </header>

    <main id="app"></main>
  </div>

  <!-- ===== Modal host ===== -->
  <div id="modal-root"></div>

  <script>window.SUPABASE_CONFIG = { url: "https://lcqdceblriciugisjxuu.supabase.co", key: "sb_publishable_6HHso-DxOsNZA4xtNBknbA_d8QM8NtX" };</script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="data.js?v=2"></script>
  <script src="store.js?v=2"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
